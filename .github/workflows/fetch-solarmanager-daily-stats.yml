name: Solar Manager Tagesstatistik -> Turso

on:
  schedule:
    # 1:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      rolling_days:
        description: "Anzahl Tage rueckwirkend aktualisieren (Standard 10; z.B. 30 fuer einmalige Korrektur nach Bugfix)"
        required: false
        default: "10"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installieren
        run: pip install -r scripts/requirements-solarmanager-live.txt

      - name: Solar Manager Tagesstatistik abrufen und speichern
        env:
          SM_EMAIL: ${{ secrets.SM_EMAIL }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_GATEWAY_ID: ${{ secrets.SM_GATEWAY_ID }}
          SM_BASE_URL: ${{ vars.SM_BASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ROLLING_DAYS: ${{ github.event.inputs.rolling_days || '10' }}
        run: python scripts/fetch_solarmanager_daily_stats.py
