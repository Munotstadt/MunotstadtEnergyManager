name: Process Solarmanager Upload

on:
  push:
    paths:
      - 'uploads/**.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solarmanager-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Process uploads
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/process_solarmanager.py

      - name: Commit processed state
        run: |
          git config user.name "solarmanager-bot"
          git config user.email "bot@munotstadt.local"
          git add uploads processed logs data
          git diff --staged --quiet || git commit -m "Process Solarmanager upload $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash
          git push
