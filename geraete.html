<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munotstadt Energy · Geräte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E30613;
    --ink:#1a1a1a;
    --grey-900:#2b2b2b;
    --grey-600:#666;
    --grey-300:#d8d8d8;
    --grey-100:#f4f4f4;
    --bg:#ffffff;
    --radius:6px;
    --panel:#ffffff; --panel-2:#f4f4f4; --border:#d8d8d8;
    --text:#1a1a1a; --text-dim:#666; --text-dim2:#8a8a8a;
    --accent:#E30613; --accent-dim:#fdeceb;
    --green:#1f9d55; --blue:#1f6feb; --amber:#b9770e; --purple:#7c3aed;
    --grid:#e8e8e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:15px; line-height:1.45;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:24px 20px 60px;}
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:2px solid var(--ink);
  }
  header.topbar .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  header.topbar .brand span{color:var(--red);}
  header.topbar .nav-link{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .nav-link:hover{background:var(--grey-100);}

  h1{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.4rem; margin:0 0 2px;}
  .sub{color:var(--text-dim); font-size:0.85rem; margin-bottom:20px;}
  h2{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1rem;
    margin:28px 0 10px; color:var(--text);
  }
  h2 .hint{color:var(--text-dim); font-weight:400; font-size:0.78rem; margin-left:6px;}

  .card{
    background:var(--bg); border:1px solid var(--grey-300); border-radius:var(--radius);
    padding:16px 18px 8px; margin-bottom:6px;
  }

  .tabs{display:inline-flex; gap:0; margin-bottom:10px; flex-wrap:wrap; border:1px solid var(--grey-300); border-radius:var(--radius); overflow:hidden;}
  .tab{
    background:#fff; border:none; border-right:1px solid var(--grey-300); color:var(--ink);
    font-family:'Inter',sans-serif; font-weight:500; font-size:13px; padding:7px 14px;
    cursor:pointer;
  }
  .tab:last-child{border-right:none;}
  .tab.active{background:var(--ink); color:#fff;}
  .tab:hover:not(.active){background:var(--grey-100);}

  table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:0.78rem;}
  th{
    text-align:right; color:var(--grey-600); font-weight:600; padding:8px 10px;
    border-bottom:1px solid var(--grey-300); font-size:0.68rem; text-transform:uppercase;
    letter-spacing:.03em; white-space:nowrap;
    position:sticky; top:0; background:var(--bg); z-index:1;
  }
  th:first-child, td:first-child{text-align:left;}
  td{text-align:right; padding:8px 10px; border-bottom:1px solid var(--grid); white-space:nowrap;}
  tr:hover td{background:var(--grey-100);}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px;}
  .table-scroll table{min-width:900px;}
  .table-vscroll{max-height:70vh; overflow-y:auto;}

  #status{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:40px 0; text-align:center;}
  .footer{color:var(--text-dim2); font-size:0.72rem; text-align:center; margin-top:30px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Munotstadt <span>Energy</span></div>
  <a href="index.html" class="nav-link">&larr; Dashboard</a>
</header>
<div class="wrap">
  <div>
    <h1>Geräte · Tagesübersicht</h1>
    <div class="sub" id="subline">Lade Daten...</div>
  </div>
  <div id="status">Lade Daten von Turso...</div>
  <div id="content" style="display:none;">

    <div class="tabs" id="rangeTabs">
      <button class="tab" data-range="30">30T</button>
      <button class="tab" data-range="90">90T</button>
      <button class="tab active" data-range="365">365T</button>
    </div>

    <h2>Tagesübersicht <span class="hint">neuster Tag zuoberst</span></h2>
    <div class="card" style="padding-bottom:14px;">
      <div class="table-scroll">
        <div class="table-vscroll">
          <table id="dailyTable"></table>
        </div>
      </div>
    </div>

  </div>
  <div class="footer" id="footerInfo"></div>
</div>

<script>
// ---------- Turso (live, read-only) ----------
const TURSO_URL = "https://munotstadtenergydb-munotstadt.aws-eu-west-1.turso.io/v2/pipeline";
const TURSO_READONLY_TOKEN = "__TURSO_READONLY_TOKEN__";

const CACHE_KEY = "munotstadt_devices_daily_cache_v1";
const CACHE_TTL_MS = 15 * 60 * 1000; // 15 Minuten

let DATA = [];
let currentRange = "365";

function fmt(n, digits=0){
  if (n === null || n === undefined || isNaN(n)) return "–";
  return n.toLocaleString('de-CH', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function writeCache(rows){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), rows })); }
  catch(e){ /* best effort */ }
}

const NUMERIC_COLS = ["Consumption_kWh","Production_kWh","GridFrom_kWh","GridTo_kWh","Entfeuchter_Waschen_kWh","Wasserpumpe_kWh","Ladestation_kWh"];

async function fetchFromTurso(){
  const body = {
    requests: [
      { type:"execute", stmt:{ sql:
        "SELECT Date_ISO, Date_Display, Consumption_kWh, Production_kWh, GridFrom_kWh, GridTo_kWh, Entfeuchter_Waschen_kWh, Wasserpumpe_kWh, Ladestation_kWh, updated_at FROM solarmanager_data ORDER BY Date_ISO"
      }},
      { type:"close" }
    ]
  };
  const res = await fetch(TURSO_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${TURSO_READONLY_TOKEN}` },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Turso HTTP ${res.status}`);
  const data = await res.json();
  const result = data.results?.[0];
  if (result?.type === "error") throw new Error(result.error?.message || "Turso-Fehler");
  const r = result?.response?.result;
  if (!r || !r.rows) return [];
  const cols = r.cols.map(c => c.name);
  return r.rows.map(row => {
    const obj = {};
    row.forEach((cell, i) => {
      const key = cols[i];
      const raw = cell.value === undefined ? null : cell.value;
      obj[key] = (raw !== null && NUMERIC_COLS.includes(key)) ? Number(raw) : raw;
    });
    return obj;
  });
}

// ---------- Metrik-Aufbereitung (gleiche Spalten wie Index-Monatsuebersicht) ----------
const METRIC_COLS = [
  {key:'total', label:'Verbr. Total'},
  {key:'other', label:'Other'},
  {key:'ladestation', label:'Ladestation'},
  {key:'entfeuchter', label:'Entfeuchter'},
  {key:'wasserpumpe', label:'Wasserpumpe'},
  {key:'production', label:'Produktion'},
  {key:'toGrid', label:'toGrid'},
  {key:'fromGrid', label:'fromGrid'},
  {key:'eigen', label:'Eigenverbr.', percent:true},
];

function metricsFromRow(r){
  const total = r.Consumption_kWh || 0;
  const ladestation = r.Ladestation_kWh || 0;
  const entfeuchter = r.Entfeuchter_Waschen_kWh || 0;
  const wasserpumpe = r.Wasserpumpe_kWh || 0;
  const other = total - ladestation - entfeuchter - wasserpumpe;
  const production = r.Production_kWh || 0;
  const toGrid = r.GridTo_kWh || 0;
  const fromGrid = r.GridFrom_kWh || 0;
  const eigen = production > 0 ? (1 - toGrid/production) * 100 : null;
  return { total, other, ladestation, entfeuchter, wasserpumpe, production, toGrid, fromGrid, eigen };
}

function cellVal(metrics, col){
  const v = metrics[col.key];
  if (v === null || v === undefined) return "–";
  return col.percent ? `${fmt(v,1)}%` : fmt(v,0);
}

function applyData(rows, sourceLabel){
  DATA = rows.slice().sort((a,b)=> a.Date_ISO < b.Date_ISO ? -1 : 1);
  if (DATA.length === 0){
    document.getElementById('status').textContent = "Noch keine Daten vorhanden.";
    return false;
  }
  document.getElementById('status').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('subline').textContent =
    `${DATA[0].Date_Display} – ${DATA[DATA.length-1].Date_Display} · ${DATA.length} Tage`;
  document.getElementById('footerInfo').textContent = `Datenquelle: ${sourceLabel}`;
  renderTable();
  return true;
}

async function load(){
  const cached = readCache();
  let shownFromCache = false;
  if (cached && cached.rows && cached.rows.length){
    applyData(cached.rows, `Turso (Cache · ${new Date(cached.ts).toLocaleTimeString('de-CH')})`);
    shownFromCache = true;
  }

  const isFresh = cached && (Date.now() - cached.ts < CACHE_TTL_MS);
  if (isFresh) return;

  try{
    const rows = await fetchFromTurso();
    if (rows.length === 0) throw new Error("Keine Daten von Turso erhalten");
    writeCache(rows);
    applyData(rows, "Turso (live)");
  } catch(e){
    console.warn("Turso-Zugriff fehlgeschlagen:", e);
    if (!shownFromCache){
      document.getElementById('status').textContent = `Fehler beim Laden: ${e.message}`;
    } else {
      const footer = document.getElementById('footerInfo');
      footer.textContent += " · Live-Update fehlgeschlagen, zeige Cache";
    }
  }
}

// ---------- Range tabs (bestimmen die Tabellenlaenge) ----------
document.querySelectorAll('#rangeTabs .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#rangeTabs .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRange = btn.dataset.range;
    renderTable();
  });
});

function renderTable(){
  const n = parseInt(currentRange, 10);
  const rows = DATA.slice(-n).slice().reverse(); // neuster Tag zuoberst
  const head = `<thead><tr><th>Datum</th>${METRIC_COLS.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>`;
  const body = `<tbody>${rows.map(r => {
    const metrics = metricsFromRow(r);
    return `<tr><td>${r.Date_Display}</td>${METRIC_COLS.map(c=>`<td>${cellVal(metrics,c)}</td>`).join('')}</tr>`;
  }).join('')}</tbody>`;
  document.getElementById('dailyTable').innerHTML = head + body;
}

load();
</script>
</body>
</html>
